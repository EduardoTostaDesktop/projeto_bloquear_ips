{% extends 'base.html' %}

{% block title %}Editar Usuário{% endblock %}

{% block content %}
<div class="container mx-auto py-10 flex justify-center">
    <form method="POST" class="bg-white p-6 rounded shadow-md w-full md:w-1/3">
        {% csrf_token %}
        <h2 class="text-2xl font-bold mb-4">Editar Usuário</h2>

        <label class="block mb-2">Username</label>
        <input type="text" name="username" value="{{ usuario.username }}" class="w-full p-2 border rounded mb-4">

        <label class="block mb-2">Email</label>
        <input type="email" name="email" value="{{ usuario.email }}" class="w-full p-2 border rounded mb-4">

        <label class="block mb-2">Tipo</label>
        <select name="tipo" class="w-full p-2 border rounded mb-4">
            {% for key, value in Usuario.TIPOS %}
                <option value="{{ key }}" {% if usuario.tipo == key %}selected{% endif %}>{{ value }}</option>
            {% endfor %}
        </select>



        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Salvar</button>
    </form>
</div>
{% endblock %}
