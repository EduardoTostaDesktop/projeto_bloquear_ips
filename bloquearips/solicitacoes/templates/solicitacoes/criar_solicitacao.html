{% extends 'base.html' %}
{% load static %}

{% block title %}Criar Solicitação{% endblock %}

{% block content %}
<div class="container mx-auto py-10 flex flex-col items-center">

    <h1 class="text-3xl font-bold mb-6">Criar Solicitação</h1>

    <form method="POST" enctype="multipart/form-data" class="w-full md:w-1/2 bg-white p-6 rounded shadow space-y-4">
        {% csrf_token %}

        <!-- Tipo -->
        <div>
            <label class="block font-semibold mb-1">Tipo</label>
            <select name="tipo" class="border rounded px-3 py-2 w-full">
                <option value="BLOQUEIO">Bloqueio</option>
                <option value="DESBLOQUEIO">Desbloqueio</option>
            </select>
        </div>

        <!-- Solicitante -->
        <div>
            <label class="block font-semibold mb-1">Solicitante</label>
            <select name="solicitante" class="border rounded px-3 py-2 w-full">
                {% for s in solicitantes %}
                    <option value="{{ s.id }}">{{ s.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Lista existente -->
        <div>
            <label class="block font-semibold mb-1">Selecionar Lista Existente</label>
            <select name="lista_existente" class="border rounded px-3 py-2 w-full">
                <option value="">-- Criar nova lista --</option>
                {% for l in listas %}
                    <option value="{{ l.id }}">{{ l.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Nome da nova lista -->
        <div>
            <label class="block font-semibold mb-1">Nome da Nova Lista (se não selecionar existente)</label>
            <input type="text" name="nome_lista" class="border rounded px-3 py-2 w-full" placeholder="Nome da lista">
        </div>

        <!-- Endereços -->
        <div>
            <label class="block font-semibold mb-1">Endereços</label>
            <select name="enderecos" class="border rounded px-3 py-2 w-full" multiple size="5">
                {% for e in enderecos %}
                    <option value="{{ e.id }}">{{ e.endereco }} - {% if e.status %}Bloqueado{% else %}Desbloqueado{% endif %}</option>
                {% endfor %}
            </select>
            <p class="text-sm text-gray-600">Segure Ctrl (ou Cmd no Mac) para selecionar múltiplos endereços.</p>
        </div>

        <!-- Data prevista -->
        <div>
            <label class="block font-semibold mb-1">Data Prevista</label>
            <input type="date" name="data_prevista" class="border rounded px-3 py-2 w-full">
        </div>

        <!-- Descrição -->
        <div>
            <label class="block font-semibold mb-1">Descrição</label>
            <textarea name="desc" class="border rounded px-3 py-2 w-full" rows="3"></textarea>
        </div>

        <!-- Observações -->
        <div>
            <label class="block font-semibold mb-1">Observações</label>
            <textarea name="obs" class="border rounded px-3 py-2 w-full" rows="3"></textarea>
        </div>

        <!-- Arquivo -->
        <div>
            <label class="block font-semibold mb-1">Arquivo</label>
            <input type="file" name="arquivo" class="border rounded px-3 py-2 w-full">
        </div>

        <!-- Botão -->
        <div class="flex justify-end">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Criar Solicitação
            </button>
        </div>
    </form>

</div>
{% endblock %}
