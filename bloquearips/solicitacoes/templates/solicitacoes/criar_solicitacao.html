{% extends 'base.html' %}
{% load static %}

{% block title %}Criar Solicitação{% endblock %}

{% block content %}
<div class="container mx-auto py-10 flex flex-col items-center">

    <h1 class="text-3xl font-bold mb-6">Criar Solicitação</h1>

    <form method="POST" enctype="multipart/form-data" class="w-full md:w-1/2 bg-white p-6 rounded shadow space-y-4">
        {% csrf_token %}

        <!-- Tipo -->
        <div>
            <label class="block font-semibold mb-1">Tipo</label>
            <select name="tipo" id="tipo_solicitacao" class="border rounded px-3 py-2 w-full" required>
                <option value="BLOQUEIO">Bloqueio</option>
                <option value="DESBLOQUEIO">Desbloqueio</option>
            </select>
        </div>

        <!-- Solicitante -->
        <div>
            <label class="block font-semibold mb-1">Solicitante</label>
            <select name="solicitante" id="solicitante_existente" class="border rounded px-3 py-2 w-full">
                <option value="">-- Criar novo solicitante --</option>
                {% for s in solicitantes %}
                    <option value="{{ s.id }}">{{ s.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Campos de novo solicitante -->
        <div id="novo_solicitante_campos" style="display:none;">
            <div class="mt-3">
                <label class="block font-semibold mb-1">Nome do Solicitante</label>
                <input type="text" name="nome_solicitante" class="border rounded px-3 py-2 w-full" placeholder="Digite o nome do solicitante">
            </div>

            <div class="mt-3">
                <label class="block font-semibold mb-1">Contato do Solicitante</label>
                <input type="text" name="contato_solicitante" class="border rounded px-3 py-2 w-full" placeholder="Digite o e-mail do solicitante">
            </div>
        </div>

        <!-- Lista existente -->
        <div>
            <label class="block font-semibold mb-1">Selecionar Lista Existente</label>
            <select name="lista_existente" id="lista_existente" class="border rounded px-3 py-2 w-full">
                <option value="">-- Criar nova lista --</option>
                {% for l in listas %}
                    <option value="{{ l.id }}">{{ l.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Campos de nova lista -->
        <div id="nova_lista_campos" style="display:none;">
            <div class="mt-3">
                <label class="block font-semibold mb-1">Nome da Nova Lista</label>
                <input type="text" name="nome_lista" maxlength="50" class="border rounded px-3 py-2 w-full" placeholder="Digite o nome da lista">
            </div>

            <!-- Upload do arquivo -->
            <div class="bg-white p-7 rounded w-9/12 mx-auto">
                <div x-data="dataFileDnD()" class="relative flex flex-col p-4 text-gray-400 border border-gray-200 rounded">
                    <div x-ref="dnd"
                        class="relative flex flex-col text-gray-400 border border-gray-200 border-dashed rounded cursor-pointer">
                        <input
                            x-ref="fileInput"
                            type="file"
                            name="arquivo"
                            accept=".xlsx"
                            class="absolute inset-0 z-50 w-full h-full opacity-0 cursor-pointer"
                            @change="addFiles($event)"
                        >
                        <div class="flex flex-col items-center justify-center py-10 text-center">
                            <svg class="w-6 h-6 mr-1 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <p class="m-0">Arraste seu arquivo aqui ou clique para selecionar.</p>
                            <p class="text-sm text-gray-500 mt-1">Somente arquivos Excel (.xlsx) são permitidos.</p>
                        </div>
                    </div>

                    <template x-if="files.length > 0">
                        <div class="mt-4">

                            <!-- Sinalizador -->
                            <p class="text-green-600 text-sm mb-2">
                                ✔ Arquivo carregado com sucesso
                            </p>

                            <!-- Grid SOMENTE para arquivos -->
                            <div class="grid grid-cols-1 gap-4">
                                <template x-for="(file, index) in files" :key="index">
                                    <div class="relative flex flex-col items-center overflow-hidden text-center bg-gray-100 border rounded p-2">
                                        <button
                                            type="button"
                                            class="absolute top-0 right-0 p-1 bg-white rounded-bl"
                                            @click="remove(index)"
                                        >
                                            ✕
                                        </button>

                                        <div x-text="file.name"></div>
                                        <div x-text="humanFileSize(file.size)"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Data prevista -->
        <div id="campo_data_prevista_desbloqueio">
            <label class="block font-semibold mb-1">Data Prevista Desbloqueio</label>
            <input type="date" name="data_prevista_desbloqueio" class="border rounded px-3 py-2 w-full">
        </div>

        <!-- Data prevista de renovação -->
        <div id="campo_data_prevista_renovacao">
            <label class="block font-semibold mb-1">Data Prevista de Renovação</label>
            <input
                type="date"
                name="data_prevista_renovacao"
                class="border rounded px-3 py-2 w-full"
            >
        </div>

        <!-- Descrição -->
        <div>
            <label class="block font-semibold mb-1">Descrição</label>
            <textarea name="desc" class="border rounded px-3 py-2 w-full" rows="3" maxlength="100"></textarea>
        </div>

        <!-- Observações -->
        <div>
            <label class="block font-semibold mb-1">Observações</label>
            <textarea name="obs" class="border rounded px-3 py-2 w-full" rows="3" maxlength="100"></textarea>
        </div>

        <!-- Botão -->
        <div class="flex justify-end space-x-2">
            <a href="{% url 'solicitacoes:listar_solicitacoes' %}"
               class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
                Cancelar
            </a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Criar Solicitação
            </button>
        </div>
    </form>
</div>

<script src="https://unpkg.com/create-file-list"></script>
<script>
        document.addEventListener("DOMContentLoaded", () => {
        const listaSelect = document.getElementById("lista_existente");
        const novaListaCampos = document.getElementById("nova_lista_campos");

        const solicitanteSelect = document.getElementById("solicitante_existente");
        const novoSolicitanteCampos = document.getElementById("novo_solicitante_campos");

        function toggleCamposLista() {
            novaListaCampos.style.display =
                !listaSelect.value ? "block" : "none";
        }

        function toggleCamposSolicitante() {
            novoSolicitanteCampos.style.display =
                !solicitanteSelect.value ? "block" : "none";
        }

        listaSelect.addEventListener("change", toggleCamposLista);
        solicitanteSelect.addEventListener("change", toggleCamposSolicitante);

        // 🔥 força estado inicial correto
        toggleCamposLista();
        toggleCamposSolicitante();
    });
</script>
<script>
    function dataFileDnD() {
    return {
        files: [],
        humanFileSize(size) {
            return (size / 1024 / 1024).toFixed(2) + " MB";
        },
        remove(index) {
            this.files = [];
            this.$refs.fileInput.value = null;
        },

        addFiles(e) {
            const selected = Array.from(e.target.files).slice(0, 1);
            this.files.splice(0, this.files.length);
            this.files.push(...selected);
        }

    };
}

</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const tipoSelect = document.getElementById("tipo_solicitacao");

    const campoDataDesbloqueio = document.getElementById("campo_data_prevista_desbloqueio");
    const campoDataRenovacao   = document.getElementById("campo_data_prevista_renovacao");

    function toggleCamposDatas() {
        if (tipoSelect.value === "DESBLOQUEIO") {
            campoDataDesbloqueio.style.display = "none";
            campoDataRenovacao.style.display   = "none";
        } else {
            campoDataDesbloqueio.style.display = "block";
            campoDataRenovacao.style.display   = "block";
        }
    }

    tipoSelect.addEventListener("change", toggleCamposDatas);

    // 🔥 estado inicial
    toggleCamposDatas();
});
</script>

{% endblock %}
