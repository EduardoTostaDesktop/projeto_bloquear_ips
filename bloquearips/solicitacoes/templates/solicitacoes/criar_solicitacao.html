{% extends 'base.html' %}
{% load static %}

{% block title %}Criar Solicitação{% endblock %}

{% block content %}
<div class="container mx-auto py-10 flex flex-col items-center">

    <h1 class="text-3xl font-bold mb-6">Criar Solicitação</h1>

    <form method="POST" enctype="multipart/form-data" class="w-full md:w-1/2 bg-white p-6 rounded shadow space-y-4">
        {% csrf_token %}

        <!-- Tipo -->
        <div>
            <label class="block font-semibold mb-1">Tipo</label>
            <select name="tipo" class="border rounded px-3 py-2 w-full" required>
                <option value="BLOQUEIO">Bloqueio</option>
                <option value="DESBLOQUEIO">Desbloqueio</option>
            </select>
        </div>

        <!-- Solicitante -->
        <div>
            <label class="block font-semibold mb-1">Solicitante</label>
            <select name="solicitante" class="border rounded px-3 py-2 w-full" required>
                {% for s in solicitantes %}
                    <option value="{{ s.id }}">{{ s.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Lista existente -->
        <div>
            <label class="block font-semibold mb-1">Selecionar Lista Existente</label>
            <select name="lista_existente" id="lista_existente" class="border rounded px-3 py-2 w-full">
                <option value="">-- Criar nova lista --</option>
                {% for l in listas %}
                    <option value="{{ l.id }}">{{ l.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Campos de nova lista -->
        <div id="nova_lista_campos" style="display:none;">
            <div class="mt-3">
                <label class="block font-semibold mb-1">Nome da Nova Lista</label>
                <input type="text" name="nome_lista" class="border rounded px-3 py-2 w-full" placeholder="Digite o nome da lista">
            </div>

        <!-- component -->
        <div class="bg-white p-7 rounded w-9/12 mx-auto">
            <div x-data="dataFileDnD()" class="relative flex flex-col p-4 text-gray-400 border border-gray-200 rounded">
                <div x-ref="dnd"
                    class="relative flex flex-col text-gray-400 border border-gray-200 border-dashed rounded cursor-pointer">
                        <input accept=".xlsx" type="file" name="arquivo" 
                            class="absolute inset-0 z-50 w-full h-full p-0 m-0 outline-none opacity-0 cursor-pointer"
                            @change="addFiles($event)"
                            @dragover="$refs.dnd.classList.add('border-blue-400', 'ring-4', 'ring-inset')"
                            @dragleave="$refs.dnd.classList.remove('border-blue-400', 'ring-4', 'ring-inset')"
                            @drop="$refs.dnd.classList.remove('border-blue-400', 'ring-4', 'ring-inset')"
                            title="Arraste ou clique para selecionar o arquivo" />

                        <div class="flex flex-col items-center justify-center py-10 text-center">
                            <svg class="w-6 h-6 mr-1 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <p class="m-0">Arraste seu arquivo aqui ou clique para selecionar.</p>
                            <p class="text-sm text-gray-500 mt-1">Somente arquivos Excel (.xlsx) são permitidos.</p>
                        </div>
                    </div>

                    <template x-if="files.length > 0">
                        <div class="grid grid-cols-1 gap-4 mt-4 md:grid-cols-3">
                            <template x-for="(_, index) in Array.from({ length: files.length })" :key="index">
                                <div class="relative flex flex-col items-center overflow-hidden text-center bg-gray-100 border rounded p-2">
                                    <button class="absolute top-0 right-0 p-1 bg-white rounded-bl focus:outline-none" type="button"
                                        @click="remove(index)">
                                    </button>
                                    <div class="text-xs truncate" x-text="files[index].name"></div>
                                    <div class="text-xs text-gray-500" x-text="humanFileSize(files[index].size)"></div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Data prevista -->
        <div>
            <label class="block font-semibold mb-1">Data Prevista</label>
            <input type="date" name="data_prevista" class="border rounded px-3 py-2 w-full">
        </div>

        <!-- Descrição -->
        <div>
            <label class="block font-semibold mb-1">Descrição</label>
            <textarea name="desc" class="border rounded px-3 py-2 w-full" rows="3"></textarea>
        </div>

        <!-- Observações -->
        <div>
            <label class="block font-semibold mb-1">Observações</label>
            <textarea name="obs" class="border rounded px-3 py-2 w-full" rows="3"></textarea>
        </div>

        <!-- Botão -->
        <div class="flex justify-end mt-4">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Criar Solicitação
            </button>
        </div>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js" defer></script>
<script src="https://unpkg.com/create-file-list"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const listaSelect = document.getElementById("lista_existente");
        const novaListaCampos = document.getElementById("nova_lista_campos");

        function toggleCampos() {
            if (listaSelect.value === "") {
                novaListaCampos.style.display = "block";
            } else {
                novaListaCampos.style.display = "none";
            }
        }

        listaSelect.addEventListener("change", toggleCampos);
        toggleCampos();
    });

    function dataFileDnD() {
    return {
        files: [],
        humanFileSize(size) {
        const i = Math.floor(Math.log(size) / Math.log(1024));
        return (size / Math.pow(1024, i)).toFixed(2) + " " + ["B", "kB", "MB", "GB", "TB"][i];
        },
        remove(index) {
        let files = [...this.files];
        files.splice(index, 1);
        this.files = createFileList(files);
        },
        addFiles(e) {
        const files = createFileList([...this.files], [...e.target.files]);
        this.files = files;
        }
    };
    }

    
</script>
{% endblock %}
