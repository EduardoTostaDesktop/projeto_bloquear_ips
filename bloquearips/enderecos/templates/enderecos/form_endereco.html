{% extends 'base.html' %}

{% block title %}{{ form.endereco.value|default:"Endereço" }}{% endblock %}

{% block content %}
<div class="container mx-auto p-6 bg-white rounded shadow-md mt-6">
    <h1 class="text-2xl font-bold mb-4">Editar Endereço</h1>

    <form method="POST">
        {% csrf_token %}

        <!-- Endereço (readonly) -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="id_endereco">
                Endereço
            </label>
            <input 
                type="text" 
                id="id_endereco" 
                name="endereco" 
                value="{{ form.endereco.value|default:'' }}" 
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 bg-gray-100 cursor-not-allowed"
                readonly
            >
        </div>

        <!-- Nome -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="id_nome" maxlength="50">
                Nome
            </label>
            {{ form.nome }}
        </div>

        <!-- Descrição -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="id_desc" maxlength="100">
                Descrição
            </label>
            {{ form.desc }}
        </div>

        <!-- Observação -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="id_obs" maxlength="100">
                Observação
            </label>
            {{ form.obs }}
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a href="{% url 'enderecos:listar_enderecos' %}" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                Cancelar
            </a>
            <button class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700" type="submit">
                Salvar
            </button>
        </div>
    </form>
</div>
{% endblock %}
