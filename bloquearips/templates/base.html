{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Projeto{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="font-bold text-xl">Meu Projeto</a>
            <div>
                <a href="/" class="px-3 hover:underline">Home</a>
                <a href="/sobre" class="px-3 hover:underline">Sobre</a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="flex-1 container mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 text-center">
        &copy; 2025 Meu Projeto. Todos os direitos reservados.
    </footer>

</body>
</html>
