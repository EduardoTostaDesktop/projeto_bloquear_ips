{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Projeto{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-gray-800 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="font-bold text-xl">CONTROLE | BLOQUEIO DE ENDEREÇOS</a>
            
            {% if user.is_authenticated %}
            <div class="flex items-center space-x-4">
                <!-- Nome e Logout -->
                <div class="flex flex-col items-end">
                    <span class="text-sm font-medium">{{ user.username }}</span>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="text-sm hover:underline">Logout</button>
                    </form>
                </div>
                
                <!-- Ícone de perfil -->
                <img src="{% static 'images/perfil.png' %}" alt="Perfil" class="h-8 w-8 rounded-full border-2 border-white">
            </div>
            {% else %}
                <a href="{% url 'login' %}" class="px-3 hover:underline">Login</a>
            {% endif %}
        </div>
    </nav>



    <!-- Conteúdo principal -->
    <main class="flex-1 container mx-auto p-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 text-center">
        &copy; 2025 Meu Projeto. Todos os direitos reservados.
    </footer>

</body>
</html>
