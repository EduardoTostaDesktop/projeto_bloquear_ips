{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Projeto{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-gray-800 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="font-bold text-xl">CONTROLE | BLOQUEIO DE ENDEREÇOS</a>
            <div class="flex items-center space-x-4">
                <a href="/" class="px-3 hover:underline">Home</a>

                {% if user.is_authenticated %}
                    <!-- Botão de Logout -->
                    <form method="POST" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="px-3 hover:underline">Logout</button>
                    </form>
                {% else %}
                    <!-- Botão de Login -->
                    <a href="{% url 'login' %}" class="px-3 hover:underline">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="flex-1 container mx-auto p-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 text-center">
        &copy; 2025 Meu Projeto. Todos os direitos reservados.
    </footer>

</body>
</html>
