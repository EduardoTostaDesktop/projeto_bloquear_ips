{% extends 'base.html' %}

{% block title %}Cadastrar Solicitante{% endblock %}

{% block content %}
<div class="container mx-auto py-10 flex flex-col items-center">

    <h1 class="text-3xl font-bold mb-6">Cadastrar Novo Solicitante</h1>

    <form method="POST" class="w-full md:w-1/2 bg-white p-6 rounded shadow">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block font-semibold mb-1">Nome</label>
            <input type="text"
                   name="nome"
                   maxlength="50"
                   required
                   class="w-full px-3 py-2 border rounded">
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-1">Contato</label>
            <input type="text"
                   name="contato"
                   maxlength="50"
                   class="w-full px-3 py-2 border rounded">
        </div>

        <div class="mb-6">
            <label class="block font-semibold mb-1">Observações</label>
            <textarea name="obs"
                      rows="2"
                      maxlength="100"
                      class="w-full px-3 py-2 border rounded"></textarea>
        </div>

        <div class="flex justify-end space-x-2">
            <a href="{% url 'solicitantes:listar_solicitantes' %}"
               class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
                Cancelar
            </a>
            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Salvar Solicitante
            </button>
        </div>

    </form>

</div>
{% endblock %}
