{% extends 'base.html' %}

{% block title %}Editar Solicitante{% endblock %}

{% block content %}
<div class="container mx-auto p-6 bg-white rounded shadow-md mt-6">
    <h1 class="text-2xl font-bold mb-4">Editar Solicitante</h1>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block mb-1">Nome</label>
            <input type="text" name="nome" maxlength="50" class="w-full p-2 border rounded" value="{{ solicitante.nome }}" required>
        </div>
        <div class="mb-4">
            <label class="block mb-1">Contato</label>
            <input type="text" name="contato" maxlength="50" class="w-full p-2 border rounded" value="{{ solicitante.contato }}">
        </div>
        <div class="mb-4">
            <label class="block mb-1">Observações</label>
            <textarea name="obs" maxlength="100" class="w-full p-2 border rounded">{{ solicitante.obs }}</textarea>
        </div>
        <div class="flex justify-end space-x-3 pt-4">
            <a href="{% url 'solicitantes:listar_solicitantes' %}" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                Cancelar
            </a>
            <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                Salvar
            </button>
        </div>
        
    </form>
</div>
{% endblock %}
