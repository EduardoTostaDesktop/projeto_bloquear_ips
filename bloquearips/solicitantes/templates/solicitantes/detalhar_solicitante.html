{% extends 'base.html' %}

{% block title %}Detalhes do Solicitante{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-4">{{ solicitante.nome }}</h1>

<p><strong>Contato:</strong> {{ solicitante.contato }}</p>
<p><strong>Observações:</strong> {{ solicitante.obs|default:"-" }}</p>

<a href="{% url 'solicitantes:editar_solicitante' solicitante.id %}" class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 mt-4 inline-block">Editar</a>
<a href="{% url 'solicitantes:listar_solicitantes' %}" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 mt-4 inline-block">Voltar</a>
{% endblock %}
