{% extends 'base.html' %}

{% block title %}Painel de Listas{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center space-y-8 py-8"> 

    <!-- Título principal -->
    <h1 class="text-5xl font-extrabold text-gray-600 text-center">
        Painel de Listas
    </h1>

    <!-- Cards de acesso -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-6">

        <!-- Cadastrar Lista -->
        <div class="bg-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition duration-300 text-center w-72">
            <h2 class="text-xl font-semibold text-blue-600 mb-4">Cadastrar Lista</h2>
            <p class="text-gray-700 mb-4">Crie novas listas de endereços e faça upload de CSV.</p>
            <a href="{% url 'listas:criar_lista' %}" class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                Cadastrar
            </a>
        </div>

        <!-- Listar Listas -->
        <div class="bg-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition duration-300 text-center w-72">
            <h2 class="text-xl font-semibold text-green-600 mb-4">Listar Listas</h2>
            <p class="text-gray-700 mb-4">Visualize e gerencie todas as listas cadastradas.</p>
            <a href="{% url 'listas:listar_listas' %}" class="inline-block bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
                Listar
            </a>
        </div>

    </div>
</div>
{% endblock %}
