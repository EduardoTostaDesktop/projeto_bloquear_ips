{% extends 'base.html' %}
{% load static %}

{% block title %}Criar Lista{% endblock %}

{% block content %}
<div class="container mx-auto py-10 flex flex-col items-center">

    <h1 class="text-3xl font-bold mb-6">Criar Nova Lista</h1>

    <form method="POST" enctype="multipart/form-data" class="w-full md:w-1/2 bg-white p-6 rounded shadow">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block font-semibold mb-1">Nome da Lista</label>
            <input type="text" name="nome" required class="w-full p-2 border rounded" placeholder="Ex: Lista de Bloqueio Agosto">
        </div>

        <!-- Solicitante -->
        <div>
            <label class="block font-semibold mb-1">Solicitante</label>
            <select name="solicitante" id="solicitante_existente"
                    class="border rounded px-3 py-2 w-full">
                <option value="">-- Criar novo solicitante --</option>
                {% for s in solicitantes %}
                    <option value="{{ s.id }}">{{ s.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Campos de novo solicitante -->
        <div id="novo_solicitante_campos" class="hidden">
            <div class="mt-3">
                <label class="block font-semibold mb-1">Nome do Solicitante</label>
                <input type="text" name="nome_solicitante"
                    class="border rounded px-3 py-2 w-full">
            </div>

            <div class="mt-3">
                <label class="block font-semibold mb-1">Contato do Solicitante</label>
                <input type="text" name="contato_solicitante"
                    class="border rounded px-3 py-2 w-full">
            </div>
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-1">Descrição</label>
            <textarea name="desc" class="w-full p-2 border rounded" rows="2"></textarea>
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-1">Observação</label>
            <textarea name="obs" class="w-full p-2 border rounded" rows="2"></textarea>
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-1">Data Prevista de Desbloqueio</label>
            <input type="date" name="data_prevista_desbloqueio" class="w-full p-2 border rounded">
        </div>

        <div class="mb-4">
            <label class="block font-semibold mb-1">Arquivo CSV de Endereços</label>
            <input type="file" name="arquivo_csv" accept=".csv" class="w-full p-2 border rounded">
        </div>

        <div class="flex justify-end space-x-2">
            <a href="{% url 'listas:listar_listas' %}"
               class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
                Cancelar
            </a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Criar Lista
            </button>
        </div>
    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const selectSolicitante = document.getElementById("solicitante_existente");
    const novoSolicitanteCampos = document.getElementById("novo_solicitante_campos");

    function toggleNovoSolicitante() {
        if (selectSolicitante.value === "") {
            // Criar novo solicitante
            novoSolicitanteCampos.style.display = "block";
        } else {
            // Usar solicitante existente
            novoSolicitanteCampos.style.display = "none";

            // limpa campos para evitar envio indevido
            novoSolicitanteCampos.querySelectorAll("input").forEach(input => {
                input.value = "";
            });
        }
    }

    // dispara ao carregar a página
    toggleNovoSolicitante();

    // dispara ao mudar o select
    selectSolicitante.addEventListener("change", toggleNovoSolicitante);
});
</script>

{% endblock %}
